<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Luxury Deep Teal Background with Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#08171B"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Glowing Water Drop Diamond Sparkle -->
  <path d="M32 10 C32 10, 42 22, 42 28 C42 33.52 37.52 38 32 38 C26.48 38 22 33.52 22 28 C22 22, 32 10, 32 10 Z" fill="url(#droplet-grad)"/>
  
  <!-- Subtle Internal Caustic Lens -->
  <ellipse cx="29" cy="24" rx="3.5" ry="5.5" transform="rotate(-25 29 24)" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- IONA Brand Name Monogram -->
  <text x="32" y="52" font-family="'Arial Narrow', 'Helvetica Neue', sans-serif" font-weight="900" font-style="italic" font-size="14" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">IONA</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="droplet-grad" x1="22" y1="10" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAFBF9"/>
      <stop offset="40%" stop-color="#72BDCE"/>
      <stop offset="100%" stop-color="#287F91"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72BDCE"/>
      <stop offset="50%" stop-color="#287F91"/>
      <stop offset="100%" stop-color="#102A30"/>
    </linearGradient>
  </defs>
</svg>
